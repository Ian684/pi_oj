<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi OJ</title>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css?v=0.16.22">
  <link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body>
  <header>
    <div><strong>Pi OJ</strong><span>Raspberry Pi Online Judge</span></div>
    <div class="header-actions">
      <span id="health" class="pill">檢查中...</span>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切換深色模式">
        <span id="themeIcon" aria-hidden="true">☾</span>
        <span id="themeLabel">深色</span>
      </button>
    </div>
  </header>

  <main>
    <section class="workspace">
      <div class="toolbar">
        <label>語言
          <select id="language">
            <option value="uva_c">ANSI C 5.3.0</option>
            <option value="uva_java">JAVA 1.8.0</option>
            <option value="uva_pascal">PASCAL 3.0.0</option>
            <option value="uva_cpp11">C++11 5.3.0</option>
            <option value="uva_py3">PYTH3 3.5.1</option>
          </select>
        </label>
        <label>平台
          <select id="judge">
            <option value="uva">UVA</option>
            <option value="codeforces">Codeforces</option>
            <option value="cpe">CPE 星題</option>
          </select>
        </label>
        <label id="problemLabel">UVA 題號 <input id="problemId" inputmode="text" maxlength="32" placeholder="100-1800 / 10000-13400"></label>
        <div id="cpeLabel" class="cpe-picker" hidden>
          <label>CPE 星等
            <select id="cpeLevel">
              <option value="must">Must 49</option>
              <option value="star1">1-star</option>
              <option value="star2">2-star</option>
              <option value="star3">3-star</option>
              <option value="star4">4-star</option>
              <option value="star5">5-star</option>
            </select>
          </label>
          <label>CPE 題目
            <select id="cpeStar">
              <option value="">Select problem...</option>
            </select>
          </label>
        </div>
        <button id="vimToggle" class="vim-toggle" type="button" aria-pressed="false" disabled>Vim OFF</button>
        <button id="pdfToggle" type="button">題目頁</button>
        <button id="run" class="primary" type="button">▶ 執行測試</button>
        <button id="uva" type="button">⇧ 提交 UVA</button>
      </div>
      <label class="editor-label">程式碼</label>
      <div id="editor" aria-label="程式碼編輯器"></div>
      <textarea id="code" class="editor-fallback" spellcheck="false" aria-label="程式碼"></textarea>
      <div id="vimStatus" class="vim-status" hidden></div>
    </section>

    <aside>
      <div class="side-tabs" role="tablist" aria-label="側邊面板">
        <button id="testTab" class="side-tab active" type="button" role="tab" aria-selected="true" aria-controls="testPanel">測試</button>
        <button id="aiTab" class="side-tab" type="button" role="tab" aria-selected="false" aria-controls="aiPanel">AI 助教</button>
      </div>

      <section id="testPanel" class="side-panel active" role="tabpanel" aria-labelledby="testTab">
        <div class="source-bar">
          <label>測資來源
            <select id="testSource">
              <option value="sample">題目範例</option>
              <option value="udebug">uDebug</option>
              <option value="ai">AI</option>
              <option value="custom">自訂</option>
            </select>
          </label>
          <button id="fetchTests" type="button">載入</button>
          <button id="openUdebug" type="button" hidden>開啟 uDebug</button>
        </div>

        <div class="panel">
          <label id="inputLabel" for="input">題目範例輸入</label>
          <textarea id="input" placeholder="stdin"></textarea>
        </div>
        <div class="panel">
          <label id="expectedLabel" for="expected">題目範例輸出（空白時只執行）</label>
          <textarea id="expected" placeholder="expected stdout"></textarea>
        </div>
        <div class="panel result-panel">
          <div class="result-title"><span>執行結果</span><span id="verdict" class="pill neutral">尚未執行</span></div>
          <div id="resultMeta" class="result-meta" hidden>
            <div><span>來源</span><strong id="resultSource">-</strong></div>
            <div><span>Submission ID</span><strong id="resultId">-</strong></div>
            <div><span>判題結果</span><strong id="resultVerdict">-</strong></div>
            <div><span>執行時間</span><strong id="resultTime">-</strong></div>
          </div>
          <pre id="output">執行程式後結果會顯示在這裡</pre>
        </div>
      </section>

      <section id="aiPanel" class="side-panel ai-panel" role="tabpanel" aria-labelledby="aiTab" hidden>
        <div class="ai-header">
          <label for="aiQuestion">AI 助教</label>
          <div class="ai-actions">
            <button id="aiAsk" class="primary" type="button">送出</button>
            <button id="aiHint" type="button">提示</button>
            <button id="aiDebug" type="button">除錯</button>
            <button id="aiTranslate" type="button">翻譯</button>
          </div>
        </div>
        <textarea id="aiQuestion" placeholder="直接問 AI，例如：Prim 演算法是什麼？給我模板。若要針對目前題目或程式碼，請在問題中提到這題、程式碼、輸入輸出或錯誤。"></textarea>
        <div id="aiOutput" class="ai-output ai-readable">AI 回答會顯示在這裡</div>
      </section>

      <div id="pdfPane" class="pdf-pane" hidden>
        <div class="pdf-toolbar">
          <strong id="pdfTitle">題目頁</strong>
          <a id="openPdf" href="#" target="_blank" rel="noopener noreferrer">開新分頁</a>
          <button id="closePdf" type="button">關閉</button>
        </div>
        <iframe id="problemPdf" title="題目頁"></iframe>
      </div>
    </aside>
  </main>

  <div id="toast" role="status"></div>
  <script src="/static/vendor/marked.umd.js?v=15.0.12"></script>
  <script src="/static/vendor/katex/katex.min.js?v=0.16.22"></script>
  <script src="/static/vendor/katex/auto-render.min.js?v=0.16.22"></script>
  <script src="/static/cpe-stars.js?v=4"></script>
  <script src="/static/app.js?v=55"></script>
</body>
</html>
