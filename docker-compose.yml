services:
  redis:
    image: redis:7-alpine
    container_name: oj_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  web:
    build:
      context: ./backend
      target: web
    container_name: oj_fastapi
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/main.py:/app/main.py
      - ./backend/tasks.py:/app/tasks.py
      - ./backend/static/index.html:/app/static/index.html
      - ./backend/static/app.js:/app/static/app.js
      - ./backend/static/style.css:/app/static/style.css
      - ./backend/static/cpe-exam.html:/app/static/cpe-exam.html
      - ./backend/static/cpe-exam.css:/app/static/cpe-exam.css
      - ./backend/static/cpe-exam.js:/app/static/cpe-exam.js
      - ./backend/static/cpe-stars.js:/app/static/cpe-stars.js
      - ./backend/static/favicon.svg:/app/static/favicon.svg
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      target: worker
    container_name: oj_celery_worker
    # Worker needs Docker socket access to launch judge containers.
    user: "0:0"
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JUDGE_IMAGE: pi_oj-judge:latest
      HOST_SANDBOX_ROOT: ${HOST_SANDBOX_ROOT}
      UVA_USERNAME: ${UVA_USERNAME:-}
      UVA_PASSWORD: ${UVA_PASSWORD:-}
      UVA_LOGIN_MODE: ${UVA_LOGIN_MODE:-browser}
      UVA_C_LANGUAGE_ID: ${UVA_C_LANGUAGE_ID:-1}
      UVA_JAVA_LANGUAGE_ID: ${UVA_JAVA_LANGUAGE_ID:-2}
      UVA_PASCAL_LANGUAGE_ID: ${UVA_PASCAL_LANGUAGE_ID:-3}
      UVA_CPP_LANGUAGE_ID: ${UVA_CPP_LANGUAGE_ID:-5}
      UVA_PY_LANGUAGE_ID: ${UVA_PY_LANGUAGE_ID:-6}
      CODEFORCES_USERNAME: ${CODEFORCES_USERNAME:-}
      CODEFORCES_PASSWORD: ${CODEFORCES_PASSWORD:-}
      CODEFORCES_C_LANGUAGE_ID: ${CODEFORCES_C_LANGUAGE_ID:-43}
      CODEFORCES_CPP_LANGUAGE_ID: ${CODEFORCES_CPP_LANGUAGE_ID:-54}
      CODEFORCES_CPP20_LANGUAGE_ID: ${CODEFORCES_CPP20_LANGUAGE_ID:-73}
      CODEFORCES_CPP23_LANGUAGE_ID: ${CODEFORCES_CPP23_LANGUAGE_ID:-89}
      CODEFORCES_JAVA_LANGUAGE_ID: ${CODEFORCES_JAVA_LANGUAGE_ID:-87}
      CODEFORCES_PY_LANGUAGE_ID: ${CODEFORCES_PY_LANGUAGE_ID:-100}
      CODEFORCES_PYPY_LANGUAGE_ID: ${CODEFORCES_PYPY_LANGUAGE_ID:-72}
      CODEFORCES_JS_V8_LANGUAGE_ID: ${CODEFORCES_JS_V8_LANGUAGE_ID:-34}
      CODEFORCES_NODE_LANGUAGE_ID: ${CODEFORCES_NODE_LANGUAGE_ID:-55}
      CODEFORCES_RUST2021_LANGUAGE_ID: ${CODEFORCES_RUST2021_LANGUAGE_ID:-75}
      CODEFORCES_RUST2024_LANGUAGE_ID: ${CODEFORCES_RUST2024_LANGUAGE_ID:-95}
      CODEFORCES_GO_LANGUAGE_ID: ${CODEFORCES_GO_LANGUAGE_ID:-32}
      CODEFORCES_PERL_LANGUAGE_ID: ${CODEFORCES_PERL_LANGUAGE_ID:-13}
      CODEFORCES_PHP_LANGUAGE_ID: ${CODEFORCES_PHP_LANGUAGE_ID:-6}
      CODEFORCES_RUBY_LANGUAGE_ID: ${CODEFORCES_RUBY_LANGUAGE_ID:-67}
      CODEFORCES_OCAML_LANGUAGE_ID: ${CODEFORCES_OCAML_LANGUAGE_ID:-19}
      CODEFORCES_D_LANGUAGE_ID: ${CODEFORCES_D_LANGUAGE_ID:-28}
      CODEFORCES_VERDICT_TIMEOUT: ${CODEFORCES_VERDICT_TIMEOUT:-90}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-900}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-900}
      OJ_STDOUT_CAPTURE_LIMIT: ${OJ_STDOUT_CAPTURE_LIMIT:-120000}
      OJ_STDERR_CAPTURE_LIMIT: ${OJ_STDERR_CAPTURE_LIMIT:-40000}
      OJ_JAVA_MEM_LIMIT: ${OJ_JAVA_MEM_LIMIT:-384m}
      OJ_GO_MEM_LIMIT: ${OJ_GO_MEM_LIMIT:-256m}
    volumes:
      - ./backend/tasks.py:/app/tasks.py
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/sandboxes:/sandboxes
    depends_on:
      - redis

  judge-image:
    build:
      context: ./backend
      dockerfile: Dockerfile.judge
    image: pi_oj-judge:latest
    profiles: ["build-only"]

volumes:
  redis_data:

